name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
          }

      - name: Build Windows installer
        run: npm run dist

      - name: Create checksum
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "release/Pulse-Setup-$packageVersion.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer not found: $installer"
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  Pulse-Setup-$packageVersion.exe" | Out-File "$installer.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "release/Pulse-Setup-$packageVersion.exe"
          gh release create $env:GITHUB_REF_NAME $installer "$installer.sha256" --verify-tag --title "Pulse $env:GITHUB_REF_NAME" --generate-notes
